name: Publish Veles Linux Flatpak

on:
  push:
    tags:
      - 'Veles/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.9.0) -- test build only, no tag or release is created'
        required: true
        type: string

env:
  APP_ID: life.radegast.RadegastVeles
  TAG_NAME: ${{ github.ref_name }}
  # Fixed, not derived from github.event.repository.name: see publish-veles-macos.yml's
  # identically-named env var for why (the GitHub repo itself is now all lowercase).
  REPO_NAME: RadegastVeles
  VELES_PROJECT: RadegastVeles/RadegastVeles.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build-flatpak:
    name: Build Linux Flatpak (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Test-build-only path -- see publish-veles-macos.yml's identically-named step for the
      # full reasoning. TAG_NAME's env-level default (github.ref_name) is only correct for the
      # real push-tag trigger; this override makes every downstream `${TAG_NAME#Veles/}` usage
      # work unmodified under workflow_dispatch too.
      - name: Resolve version for manual test build
        if: github.event_name == 'workflow_dispatch'
        run: echo "TAG_NAME=Veles/${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Compute version
        run: echo "VERSION=${TAG_NAME#Veles/}" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: nuget-${{ env.DOTNET_VERSION }}-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Scoped to $VELES_PROJECT -- see publish-veles-macos.yml's identically-named steps for
      # the full reasoning (a bare `dotnet restore`/`dotnet build` defaults to Radegast.sln,
      # which also pulls in the Windows-only WiX installer projects; those can't be restored on
      # a Linux runner either).
      - name: Restore
        run: dotnet restore "$VELES_PROJECT"

      - name: Build
        run: dotnet build "$VELES_PROJECT" --configuration Release --no-restore

      - name: Publish (self-contained, linux-x64)
        run: |
          set -e
          dotnet publish "$VELES_PROJECT" \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:PublishTrimmed=false \
            -o publish/flatpak-source

      - name: Install Flatpak tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            .flatpak-builder/cache
          key: flatpak-runtime-24.08-${{ hashFiles('flatpak/*.yml') }}
          restore-keys: flatpak-runtime-24.08-

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak install --user -y \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: |
          set -e
          flatpak-builder \
            --user \
            --repo=flatpak-repo \
            --force-clean \
            --state-dir=.flatpak-builder \
            flatpak-build \
            flatpak/${{ env.APP_ID }}.yml

      - name: Create Flatpak bundle
        run: |
          set -e
          mkdir -p dist
          flatpak build-bundle \
            flatpak-repo \
            "dist/${REPO_NAME}-${TAG_NAME#Veles/}-x86_64.flatpak" \
            "$APP_ID"

      # Skipped entirely for manual test builds -- see publish-veles-macos.yml's identically-
      # named step for the full reasoning (never create a tag/release for a test build).
      - name: Ensure GitHub Release exists
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME not found yet; creating draft release"
            extra_args=()
            if [[ "$VERSION" == *-* ]]; then
              extra_args+=(--prerelease)
            fi
            gh release create "$TAG_NAME" --draft --title "Radegast Veles ${TAG_NAME#Veles/}" --notes "Automated build for $TAG_NAME" "${extra_args[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Flatpak to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        run: gh release upload "$TAG_NAME" dist/*.flatpak --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: radegast-veles-linux-x86_64-${{ env.VERSION }}
          path: dist/*.flatpak
