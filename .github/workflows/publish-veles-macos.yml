name: Publish Veles macOS

on:
  push:
    tags:
      - 'Veles/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.9.0) -- test build only, no tag or release is created'
        required: true
        type: string

env:
  # Fixed, not derived from github.event.repository.name: the GitHub repo itself is named all
  # lowercase ("radegast"), which produced a lowercase "radegast.app" bundle, CFBundleName, etc.
  # Match the Windows workflow's own convention (hardcoded "RadegastVeles" throughout) instead.
  REPO_NAME: RadegastVeles
  TAG_NAME: ${{ github.ref_name }}
  PUBLISH_DIR: publish
  VELES_PROJECT: RadegastVeles/RadegastVeles.csproj
  DOTNET_VERSION: '10.0.x'
  # Pinned release from https://github.com/KhronosGroup/MoltenVK/releases -- macOS has no
  # system Vulkan driver at all, so the renderer needs this bundled or it can't init Vulkan
  # on any Mac. Downloaded fresh each run rather than vendored in-repo (it's ~11MB and has its
  # own upstream release cadence); bump this to pick up a MoltenVK update.
  MOLTENVK_VERSION: 'v1.4.2'

jobs:
  build-macos:
    name: Build macOS per-arch
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Test-build-only path: no tag exists yet at this ref (workflow_dispatch runs against
      # whatever branch/ref was picked in the "Run workflow" UI, not a pushed tag), so TAG_NAME
      # (env-level default: github.ref_name, correct only for the real push-tag trigger) is
      # overridden here to the same "Veles/<version>" shape a real tag would have -- every
      # downstream step already does `${TAG_NAME#Veles/}` to recover the bare version, so this
      # is the only change needed to make them work unmodified under either trigger.
      - name: Resolve version for manual test build
        if: github.event_name == 'workflow_dispatch'
        run: echo "TAG_NAME=Veles/${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Compute version
        run: echo "VERSION=${TAG_NAME#Veles/}" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: nuget-${{ env.DOTNET_VERSION }}-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      # Scoped to $VELES_PROJECT, not the bare `dotnet restore`/`dotnet build` this used to be:
      # with no target, both default to discovering Radegast.sln in the repo root, which also
      # pulls in the Windows-only WiX installer projects (Install/VelesSetup,
      # Install/RadegastSetup) -- those can't be restored/built on a macOS runner at all
      # (WiX toolset is Windows-only), and fail with "project.assets.json does not exist"
      # since nothing ever restored them.
      - name: Restore
        run: dotnet restore "$VELES_PROJECT"

      - name: Build
        run: dotnet build "$VELES_PROJECT" --configuration Release --no-restore

      - name: Publish for macOS (osx-${{ matrix.arch }})
        run: |
          set -e
          RID=osx-${{ matrix.arch }}
          mkdir -p $PUBLISH_DIR/$RID
          if [ -n "$VELES_PROJECT" ] && [ -f "$VELES_PROJECT" ]; then
            echo "Publishing Veles project ($VELES_PROJECT) with PublishSingleFile=false and PublishTrimmed=false"
            dotnet publish "$VELES_PROJECT" -c Release -r $RID --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o $PUBLISH_DIR/$RID
          else
            echo "Veles project not found; doing generic dotnet publish"
            dotnet publish -c Release -r $RID --self-contained true -o $PUBLISH_DIR/$RID
          fi

      # macOS has no native Vulkan driver -- RadegastVeles's Vulkan renderer (Silk.NET.Vulkan)
      # needs a Vulkan implementation bundled in the app itself or it can't initialize at all.
      # MoltenVK is a Vulkan-on-Metal translation layer; its dylib can be linked/loaded directly
      # as a complete Vulkan implementation (Khronos's own documented "direct linking" mode --
      # confirmed here by checking libMoltenVK.dylib actually exports vkCreateInstance etc.),
      # skipping the separate Vulkan Loader + ICD-manifest-JSON setup entirely. Silk.NET's own
      # default native-library search only tries vulkan-derived names (verified by inspecting
      # Silk.NET.Vulkan.dll/Silk.NET.Core.dll directly -- "MoltenVK" appears nowhere in either),
      # so the real file is symlinked under those names too; placed in $PUBLISH_DIR/$RID (before
      # the app-wrapper step's rsync) so it flows into Contents/MacOS/ and gets code-signed like
      # every other bundled dylib.
      - name: Bundle MoltenVK (Vulkan)
        run: |
          set -e
          RID=osx-${{ matrix.arch }}
          PUB_DIR=$PUBLISH_DIR/$RID
          curl -sL -o moltenvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-macos.tar"
          tar -xf moltenvk.tar "MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib" "MoltenVK/LICENSE"
          cp "MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib" "$PUB_DIR/libMoltenVK.dylib"
          ln -sf libMoltenVK.dylib "$PUB_DIR/libvulkan.dylib"
          ln -sf libMoltenVK.dylib "$PUB_DIR/libvulkan.1.dylib"
          mkdir -p "$PUB_DIR/licenses"
          cp "MoltenVK/LICENSE" "$PUB_DIR/licenses/MoltenVK-LICENSE.txt"
          rm -rf moltenvk.tar MoltenVK

      - name: Create minimal .app wrapper if none exists
        run: |
          set -e
          RID=osx-${{ matrix.arch }}
          PUB_DIR=$PUBLISH_DIR/$RID
          APP_NAME="${REPO_NAME}.app"
          APP_DIR="$PUB_DIR/$APP_NAME"
          if [ -d "$PUB_DIR" ]; then
            if find "$PUB_DIR" -maxdepth 1 -type d -name '*.app' -print -quit | grep -q .; then
              echo ".app bundle already present for $RID"
            else
              echo "Creating minimal .app wrapper: $APP_DIR"
              mkdir -p "$APP_DIR/Contents/MacOS"
              PLIST="$APP_DIR/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleName string ${REPO_NAME}" \
                -c "Add :CFBundleExecutable string RadegastVeles" \
                -c "Add :CFBundleIdentifier string com.${{ github.repository_owner }}.${REPO_NAME}" \
                -c "Add :CFBundleVersion string ${TAG_NAME#Veles/}" \
                -c "Add :CFBundleShortVersionString string ${TAG_NAME#Veles/}" \
                -c "Add :CFBundlePackageType string APPL" \
                -c "Add :CFBundleIconFile string veles" \
                "$PLIST"
              mkdir -p "$APP_DIR/Contents/Resources"
              cp "RadegastVeles/Assets/veles.icns" "$APP_DIR/Contents/Resources/veles.icns"
              # Exclude the .app dir itself to avoid a self-referential copy
              rsync -a --exclude="$APP_NAME" "$PUB_DIR/" "$APP_DIR/Contents/MacOS/"
              # Only the actual native executables need +x -- rsync -a already preserved
              # dotnet publish's own correct permission bits (apphost and .dylibs executable,
              # managed .dlls not), this just backstops that. A blanket `chmod -R +x` here
              # previously marked every one of the ~250 managed .dlls executable too, and
              # `codesign --verify --deep --strict` treats any executable-permission file in a
              # signed bundle as code that must carry its own signature -- since those .dlls
              # never got one, the whole bundle failed strict validation ("code object is not
              # signed at all... LibreMetaverse.LslTools.dll") and macOS's AMFI refused to
              # launch it at all (SIGKILL, exit 137) at first run, unrelated to quarantine.
              chmod +x "$APP_DIR/Contents/MacOS/RadegastVeles"
              find "$APP_DIR/Contents/MacOS" -maxdepth 1 -name '*.dylib' -exec chmod +x {} +
            fi
          else
            echo "Publish directory not found: $PUB_DIR"
            exit 1
          fi

      - name: Ad-hoc code sign .app (osx-${{ matrix.arch }})
        run: |
          set -e
          RID=osx-${{ matrix.arch }}
          APP=$(find "$PUBLISH_DIR/$RID" -maxdepth 1 -type d -name '*.app' -print -quit)
          # No Apple Developer ID certificate is available, so this is an ad-hoc signature
          # (identity "-": no certificate, no notarization). It's still required for arm64
          # builds to launch at all under macOS's kernel-level code-signing enforcement.
          # Gatekeeper will still show an "unidentified developer" prompt on first launch —
          # see README for the right-click > Open workaround.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: radegast-veles-macos-${{ matrix.arch }}-publish
          path: ${{ env.PUBLISH_DIR }}/osx-${{ matrix.arch }}

      - name: Create per-arch DMG and tarball
        run: |
          set -e
          RID=osx-${{ matrix.arch }}
          SRC_APP=$(find "$PUBLISH_DIR/$RID" -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$SRC_APP" ]; then
            SRC_APP="$PUBLISH_DIR/$RID"
          fi
          DIST_DIR=dist/$RID
          mkdir -p "$DIST_DIR"
          if npx --yes create-dmg "$SRC_APP" "$DIST_DIR"; then
            echo "DMG created for $RID"
            # create-dmg names its output from the app's CFBundleName+version alone (e.g.
            # "Radegast 1.9.0.dmg"), with no RID in it -- both matrix legs would otherwise
            # produce an identically-named DMG, and uploading both to the same GitHub Release
            # with --clobber would silently overwrite one arch's DMG with the other's.
            DMG_FILE=$(find "$DIST_DIR" -maxdepth 1 -name '*.dmg' -print -quit)
            if [ -n "$DMG_FILE" ]; then
              mv "$DMG_FILE" "$DIST_DIR/${REPO_NAME}-${TAG_NAME#Veles/}-$RID.dmg"
            fi
          else
            echo "create-dmg failed for $RID; DMG will be missing, tarball still produced below"
          fi
          # Always produced, not just a create-dmg fallback: a DMG downloaded via a browser
          # picks up macOS's com.apple.quarantine attribute, and Gatekeeper refuses to launch a
          # quarantined, ad-hoc-only-signed app at all (no Developer ID/notarization available
          # here) -- it just closes immediately from Finder, or "Permission denied" from a
          # shell. Extracting a .tbz with command-line `tar` does not propagate quarantine to
          # the extracted contents the way Archive Utility's .dmg/.zip handling does, so this is
          # the one format that actually runs for testers.
          tar -cjf "$DIST_DIR/${REPO_NAME}-${TAG_NAME#Veles/}-$RID.tbz" -C "$(dirname "$SRC_APP")" "$(basename "$SRC_APP")"

      - name: Upload per-arch DMG/tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: radegast-veles-macos-${{ matrix.arch }}-${{ env.VERSION }}
          path: dist/osx-${{ matrix.arch }}/*

      # A prior "universal" (lipo-fused x64+arm64) build was dropped: self-contained .NET
      # publishes ship System.Private.CoreLib.dll (and the rest of the BCL) pre-compiled per
      # architecture (R2R) inside a PE container, not Mach-O, so lipo can't fuse them (there is
      # no such thing as a universal PE file) -- the fused apphost ran fine, then failed to load
      # CoreLib with "incorrect format" (HRESULT 0x8007000B) since it was silently left x64-only.
      # Shipping the two per-arch bundles this job already builds correctly is the standard
      # approach for self-contained .NET on macOS. Matrix legs run in parallel, so this can race
      # another leg creating the same release; treat "already exists" as success rather than
      # failing, and skipped entirely for manual test builds (a test build must never create a
      # tag/release -- gh release create with a tag_name that doesn't exist yet WOULD create it).
      - name: Ensure GitHub Release exists
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME not found yet; creating draft release"
            extra_args=()
            if [[ "$VERSION" == *-* ]]; then
              extra_args+=(--prerelease)
            fi
            gh release create "$TAG_NAME" --draft --title "Radegast Veles ${TAG_NAME#Veles/}" --notes "Automated build for $TAG_NAME" "${extra_args[@]}" \
              || gh release view "$TAG_NAME" >/dev/null 2>&1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-arch packages to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        run: |
          shopt -s nullglob
          RID=osx-${{ matrix.arch }}
          ASSETS=(dist/$RID/*.dmg dist/$RID/*.tbz)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No packages found in dist/$RID"
            exit 1
          fi
          gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
